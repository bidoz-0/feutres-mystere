<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Extraire les feutres</title>
<style>
  body { font-family: sans-serif; margin: 1rem; }
  #erreur { color: #b00020; font-weight: bold; white-space: pre-wrap; }
  .pastille { display: inline-block; width: 1.5em; height: 1.5em; border: 1px solid #888; vertical-align: middle; }
  #apercu { columns: 4 14em; font-size: 0.85rem; }
  textarea { width: 100%; height: 14em; }
</style>
</head>
<body>
<h1>Extraire les feutres</h1>
<p>Copier le JSON ci-dessous dans <code>data/feutres.json</code>.</p>
<p id="erreur"></p>
<textarea id="json" readonly></textarea>
<div id="apercu"></div>
<script type="module">
import { trouverCases, casesEnGrille, couleurCase } from './grille.js';
import { CODES_LANGUO } from './codes-languo.js';
import { CODES_GUANGNA } from './codes-guangna.js';

const FOND = [255, 255, 255]; // blanc dans le cadre des deux images
const erreur = document.getElementById('erreur');

function charger(src) {
  return new Promise((ok, ko) => {
    const im = new Image();
    im.onload = () => ok(im);
    im.onerror = () => ko(new Error('Image introuvable : ' + src));
    im.src = src;
  });
}

async function lire(src, marque, codes, colonnes, lignes) {
  const im = await charger(src);
  const canvas = document.createElement('canvas');
  canvas.width = im.naturalWidth; canvas.height = im.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(im, 0, 0);
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  let cases;
  try { cases = casesEnGrille(trouverCases(img, FOND), colonnes, lignes); }
  catch (e) { throw new Error(marque + ' : ' + e.message); }
  if (cases.length !== codes.length) {
    throw new Error(`${marque} : ${cases.length} cases détectées pour ${codes.length} codes (attendu : égalité).`);
  }
  return cases.map((c, i) => {
    const { code, nom } = typeof codes[i] === 'string' ? { code: codes[i], nom: codes[i] } : codes[i];
    return { marque, code, nom, hex: couleurCase(img, c) };
  });
}

try {
  const feutres = [
    ...await lire('../sources/languo-240-amazon.webp', 'languo', CODES_LANGUO, 20, 12),
    ...await lire('../sources/guangna-168-amazon.webp', 'guangna', CODES_GUANGNA, 14, 12),
  ];
  document.getElementById('json').value = JSON.stringify(feutres, null, 1);
  document.getElementById('apercu').innerHTML = feutres.map((f) =>
    `<div><span class="pastille" style="background:${f.hex}"></span> ${f.code}${f.nom === f.code ? '' : ' ' + f.nom} ${f.hex}</div>`).join('');
} catch (e) {
  erreur.textContent = e.message;
}
</script>
</body>
</html>
